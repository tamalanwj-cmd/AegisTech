# TSPES dashboard: static SPA hosting + NocoDB API reverse proxy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # NocoDB REST API proxy. The SPA is built with REACT_APP_NOCODB_URL=/nocodb,
    # so browser calls stay same-origin (no CORS, works on any host/IP).
    # Trailing slash on proxy_pass strips the /nocodb prefix.
    location /nocodb/ {
        proxy_pass http://nocodb:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA history fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
